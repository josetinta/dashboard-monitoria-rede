*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#02060b;font-family:'Chakra Petch','Segoe UI',Roboto,Arial,sans-serif;color:#d6ecf7}
#stage{position:absolute;left:0;top:0;width:1494px;height:840px;transform-origin:0 0;overflow:hidden;background:radial-gradient(1200px 700px at 50% 38%,#0b2233,#050e18 55%,#03080f)}
#stage>*,#dyn>*{position:absolute}
.pn>*,.bx>*{position:absolute}
.pn{background:linear-gradient(180deg,rgba(9,28,44,.92),rgba(5,15,25,.94));border:1px solid #13405a;border-radius:3px}
.pn:before,.pn:after{content:'';position:absolute;width:11px;height:11px;border:2px solid #28d6ff;pointer-events:none}
.pn:before{left:-1px;top:-1px;border-right:0;border-bottom:0}.pn:after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.pt{left:0;top:0;width:100%;height:30px;padding:7px 14px;font-size:13.5px;font-weight:600;color:#c9efff;white-space:nowrap;background:linear-gradient(90deg,rgba(40,214,255,.28),rgba(40,214,255,0) 70%);border-bottom:1px solid #123a52}
.mut{color:#7fa3b8}.cy{color:#28d6ff}.co{color:#ff6f59}
svg{display:block;overflow:visible}
svg text{font-family:'Chakra Petch','Segoe UI',Arial,sans-serif}
.lang{width:42px;height:28px;line-height:26px;text-align:center;border:1px solid #14455f;background:#07182a;color:#8fb6cc;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:3px}
.lang:hover{color:#fff;border-color:#28d6ff}.lang.on{background:#28d6ff;border-color:#28d6ff;color:#03131c}
.chip{display:flex;align-items:center;justify-content:center;height:26px;border:1px solid #14455f;background:#07182a;color:#8fb6cc;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;border-radius:3px}
.chip:hover{color:#fff;border-color:#28d6ff}
.chip.on{background:#28d6ff;border-color:#28d6ff;color:#03131c}
.chip.all{background:#0d3a50;border-color:#1f7ea0;color:#bff1ff}
.chip.na{background:#050f19;color:#3d5668;border-color:#0e2a3b;cursor:default}
.ob{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid #14455f;background:#07182a;color:#9cc2d6;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;border-radius:3px}
.ob:hover{border-color:#28d6ff;color:#fff}.ob.on{border-color:#28d6ff;background:#0b2e44;color:#fff}
.sm{display:flex;align-items:center;justify-content:center;height:22px;padding:0 9px;border:1px solid #14455f;background:#07182a;color:#8fb6cc;font-size:11.5px;font-weight:600;cursor:pointer;border-radius:3px}
.sm:hover{color:#fff;border-color:#28d6ff}.sm.on{background:#28d6ff;border-color:#28d6ff;color:#03131c}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:30px;border:1px solid #14455f;background:#07182a;color:#cfeaf7;font-size:12px;font-weight:600;cursor:pointer;border-radius:3px;white-space:nowrap}
.btn:hover{border-color:#28d6ff;color:#fff}
.pill{display:flex;align-items:center;justify-content:center;height:28px;border-radius:3px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer;border:1px solid}
.pill.em{background:#07182a;border-color:#14455f;color:#cfeaf7}
.pill.yt{background:rgba(230,33,23,.13);border-color:rgba(230,33,23,.4);color:#f2857d}.pill.li{background:rgba(10,102,194,.17);border-color:rgba(60,150,230,.45);color:#7bb8ec}.pill.pf{background:rgba(40,214,255,.1);border-color:rgba(40,214,255,.38);color:#7fe3ff}.pill.wa{background:rgba(31,168,85,.14);border-color:rgba(31,168,85,.42);color:#6bcf94}
.pill:hover{filter:brightness(1.3)}
.hit{pointer-events:auto;cursor:pointer}
.rw{cursor:pointer}
#tip{position:fixed;z-index:90;pointer-events:none;display:none;background:#041320;border:1px solid #28d6ff;color:#c9efff;font:600 12.5px 'Chakra Petch','Segoe UI',Arial;padding:5px 10px;white-space:nowrap;border-radius:3px}
#tbl{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center}
#tbl.show{display:flex}
#sheet{width:min(1300px,96vw);height:min(720px,88vh);background:#07141f;border:1px solid #28d6ff;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;font-family:'Chakra Petch','Segoe UI',Arial,sans-serif}
#sheet .tp{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0a2234;border-bottom:1px solid #123a52}
#sheet .tp b{flex:1;font-size:16px;color:#7fe3ff}
#sheet button{height:30px;padding:0 14px;border:1px solid #28d6ff;border-radius:3px;background:#0b2e44;color:#fff;font-weight:600;cursor:pointer;font-family:inherit}
#sheet button:hover{background:#28d6ff;color:#03131c}
#sheet .scr{flex:1;overflow:auto}
#sheet table{border-collapse:collapse;font-size:12.5px;width:100%}
#sheet th{position:sticky;top:0;background:#0a2234;color:#9fe9ff;padding:6px 9px;text-align:right;white-space:nowrap;border:1px solid #123a52}
#sheet td{padding:4px 9px;border:1px solid #0e2a3b;text-align:right;color:#d6ecf7;white-space:nowrap}
#sheet th:nth-child(-n+3),#sheet td:nth-child(-n+3){text-align:left}
#sheet tr:nth-child(even) td{background:#091a28}
#sheet td[contenteditable]:focus{outline:2px solid #28d6ff;background:#0d3550}
</style></head>
